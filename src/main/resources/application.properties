# SUG-003: the Faceboard creator account's numeric user id, reserved for one Suggested Friends
# slot when eligible (FriendshipService.isCreatorEligible). Identified ONLY by this id - never by
# name/username in any query. -1 (default, i.e. unset) disables the reservation entirely.
faceboard.creator-user-id=${FACEBOARD_CREATOR_USER_ID:-1}
#FOR LOCALHOST

