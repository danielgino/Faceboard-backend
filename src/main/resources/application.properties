#spring.datasource.username=root
#spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HikariPool-1
# H1-B: RESOLVED. Production was baselined (flyway_schema_history seeded at version 1) and
# migrated (V2 added the 6 missing NOT NULL constraints; V3 added the missing unique constraint
# on users.user_name) in separate, explicitly-authorized, individually-verified production
# passes - see BACKEND_DEEP_AUDIT.md's [H1-B] section for the full evidence trail. The live
# schema now genuinely matches the JPA entity metadata, so Hibernate now only *validates* the
# schema at boot (fails fast on drift) instead of silently auto-altering it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# H1-B: Flyway is now the active schema-management authority. No spring.flyway.url/user/password
# are set, so Flyway reuses the existing spring.datasource.* connection
# (${DB_URL}/${DB_USERNAME}/${DB_PASSWORD}) rather than needing separate configuration.
# `baseline-on-migrate=false` stays explicit even now that baseline has already run once: it
# must never silently re-baseline a future environment (e.g. a new deploy target) that happens
# to already have a non-empty, not-yet-tracked schema - that must always be a deliberate,
# separate `flyway baseline` command, never an automatic side effect of the app starting up.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.frontendBaseUrl=${FRONTEND_BASE_URL:https://faceboard-frontend.vercel.app}

app.mail.from=${SMTP_EMAIL}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_EMAIL}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ?????????: timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
