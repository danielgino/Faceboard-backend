# H1-A fix: SQL statement text and bind-parameter values are no longer logged by default.
# HIBERNATE_SQL_LOG_LEVEL controls every Hibernate SQL/bind-related logger below in one place -
# DEBUG shows parameterized statement shape only (no data), TRACE additionally includes the
# actual bound values (use only for temporary, deliberate debugging). Covers the current
# Hibernate 6 bind-parameter logger (org.hibernate.orm.jdbc.bind) as well as the legacy category
# already present in this file (org.hibernate.type.descriptor.sql / .BasicBinder), so neither can
# silently leak bind values regardless of which one a given Hibernate minor version routes
# through. Safe/off unless an operator explicitly sets these environment variables.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_SQL_LOG_LEVEL:WARN}
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
# H-PAGE1: OSIV disabled deliberately - every LAZY @OneToMany/@ManyToMany getter access
# (Post.images, Post.likes; audited, no other such getter is called anywhere in the codebase) now
# happens inside an explicit @Transactional(readOnly = true) service boundary (PostService), so
# lazy loading no longer needs a session kept open through the web/view layer.
spring.jpa.open-in-view=false