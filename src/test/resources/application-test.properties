# contextLoads fix: isolated properties for the "test" Spring profile, active ONLY for
# ApiMyWebsiteApplicationTests (@ActiveProfiles("test")). Nothing here is a real credential -
# every value is a placeholder or points at an in-memory H2 instance that exists only for the
# lifetime of this one test's application context. Production's own application.properties
# (real DB_URL/DB_USERNAME/DB_PASSWORD, ddl-auto=validate, spring.flyway.enabled=true) is
# completely untouched by this file; it only ever applies when this profile is explicitly active.

# Raw env-var-style keys referenced by application.properties's ${...} placeholders.
DB_URL=jdbc:h2:mem:contextLoadsTest;DB_CLOSE_DELAY=-1;MODE=MySQL
DB_USERNAME=sa
DB_PASSWORD=
CLOUDINARY_NAME=test-cloud
CLOUDINARY_API_KEY=test-cloudinary-key
CLOUDINARY_API_SECRET=test-cloudinary-secret
SMTP_EMAIL=test@example.com
SMTP_PASSWORD=test-smtp-password
JWT_SECRET=test-only-placeholder-not-a-real-secret-for-context-loads

# These are hardcoded (not ${...} placeholders) in the base application.properties, so they must
# be overridden directly here rather than via a raw env-var key. database-platform MUST be
# overridden, not just left unset: profile properties only override matching keys, so without
# this the base file's MySQL8Dialect would still apply here (against an H2 connection). Hibernate
# 6 logs a harmless "does not need to be specified explicitly" deprecation notice for this -
# expected and safe to ignore, since the alternative (inheriting MySQL8Dialect) is actually wrong.
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Builds the schema straight from the JPA entity mappings for this isolated in-memory instance -
# deliberately NOT validate/Flyway: the committed migrations are written for and only meaningful
# against the real MySQL schema, and validating an H2 instance against them would prove nothing.
# This does not weaken production's own ddl-auto=validate / spring.flyway.enabled=true, which
# stay exactly as they are and only apply when this profile is not active.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
